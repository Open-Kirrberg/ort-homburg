# ort.toml – Steckbrief von Homburg für den Saar LiDAR Explorer (Format sle-ort-v1).
# Die Pipeline des Explorers liest diese Datei bei jedem Build (pipeline/place.py); `werkzeuge/ort_check.py`
# prüft sie schon im Pull Request (Schema: werkzeuge/schemas/ort.schema.json). Unbekannte Schlüssel sind Fehler.

schema = "sle-ort-v1"
id = "homburg"
name_de = "Homburg"
ags = "10045114"   # Kreisstadt Homburg, Saarpfalz-Kreis (8 Gemarkungen, 82,6 km²)
state = "SL"
maintainers = ["huhn511"]

[options]
# Relikt-Kandidaten: an. Die öffentlichen Gesamtdaten (saar-lidar-data, AOI overall) zeigen die Kandidaten für
# dieses Gebiet schon (ADR 0009); beim Umzug in dieses Repository bleibt das bewusst so (ADR 0053).
# Kandidaten sind Hypothesen, keine Funde – Schauen, nicht graben. Kampfmittel-Klassen gibt es hier nie (ADR 0010).
relict_candidates = true
# Punktwolken der drei bestehenden Schwerpunkte in Homburg (pipeline/aois.toml, [[defaults.pointclouds]]).
pointclouds = ["karlsberg-schloss", "homburg-schlossberg", "merburg"]
